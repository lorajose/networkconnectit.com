name: Public Site Quality

on:
  pull_request:
    paths:
      - '*.html'
      - 'tools/**'
      - 'robots.txt'
      - 'sitemap.xml'
      - '.htaccess'
      - '.github/workflows/public-site-quality.yml'
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'tools/**'
      - 'robots.txt'
      - 'sitemap.xml'
      - '.htaccess'
      - '.github/workflows/public-site-quality.yml'

permissions:
  contents: read

jobs:
  verify-public-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate sitemap is well-formed XML
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('sitemap.xml')"

      - name: Require sitemap URLs to map to public files
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          from urllib.parse import urlparse

          root = ET.parse('sitemap.xml').getroot()
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          failures = []
          for node in root.findall('sm:url/sm:loc', ns):
              url = node.text.strip()
              parsed = urlparse(url)
              if parsed.scheme != 'https' or parsed.netloc != 'networkconnectit.com':
                  failures.append(f'{url}: must use canonical https://networkconnectit.com host')
                  continue
              path = parsed.path
              if path == '/':
                  candidate = Path('index.html')
              elif path.endswith('/'):
                  candidate = Path(path.lstrip('/')) / 'index.html'
              else:
                  candidate = Path(path.lstrip('/'))
              if not candidate.is_file():
                  failures.append(f'{url}: missing repository file {candidate}')
          if failures:
              raise SystemExit('\n'.join(failures))
          PY

      - name: Require canonical homepage and sitemap declaration
        run: |
          grep -Fq '<link rel="canonical" href="https://networkconnectit.com/">' index.html
          grep -Fq 'Sitemap: https://networkconnectit.com/sitemap.xml' robots.txt

      - name: Reject self-serving LocalBusiness aggregate ratings
        run: |
          if grep -R --include='*.html' -n '"aggregateRating"' .; then
            echo 'ERROR: LocalBusiness/Organization aggregate ratings require an explicit policy review and must not be self-serving.'
            exit 1
          fi

      - name: Inventory high-risk public trust claims
        run: |
          mkdir -p /tmp/nci-quality
          grep -R --include='*.html' -Eni '24/7|guaranteed|guarantee|SLA|< ?4h|4h priority|cloud CCTV backup|dedicated technician|happy clients|created projects' . > /tmp/nci-quality/trust-claims.txt || true
          echo 'High-risk trust claims found for evidence review:'
          cat /tmp/nci-quality/trust-claims.txt || true
          if [ -s /tmp/nci-quality/trust-claims.txt ]; then
            echo 'NOTICE: Claims listed above require evidence or conservative wording before release. See docs/seo/NCI-039-trust-claims-audit.md.'
          fi

      - name: Require private Command Center surfaces to declare noindex
        run: |
          grep -Fq 'index: false' 'command-center-app/app/(protected)/layout.tsx'
          grep -Fq 'follow: false' 'command-center-app/app/(protected)/layout.tsx'
          grep -Fq 'index: false' 'command-center-app/app/(auth)/layout.tsx'
          grep -Fq 'follow: false' 'command-center-app/app/(auth)/layout.tsx'

      - name: Confirm baseline static security headers
        run: |
          grep -Fq 'X-Content-Type-Options "nosniff"' .htaccess
          grep -Fq 'Referrer-Policy "strict-origin-when-cross-origin"' .htaccess
          grep -Fq 'X-Frame-Options "SAMEORIGIN"' .htaccess
