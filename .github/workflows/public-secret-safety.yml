name: Public Source Secret Safety

on:
  pull_request:
    paths:
      - '**/*.php'
      - '**/*.html'
      - '**/*.js'
      - '**/*.ts'
      - '**/*.tsx'
      - '.cpanel.yml'
      - '.github/workflows/public-secret-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reject-hard-coded-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject known secret assignment patterns
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          extensions = {'.php', '.html', '.js', '.ts', '.tsx', '.yml', '.yaml'}
          pattern = re.compile(
              r"(?i)(password|secret[_-]?key|api[_-]?key)\s*=\s*['\"]([^'\"]{8,})['\"]"
          )
          findings = []

          for path in pathlib.Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in extensions:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for line_number, line in enumerate(text.splitlines(), 1):
                  if pattern.search(line):
                      findings.append(f"{path}:{line_number}: possible hard-coded secret assignment")

          if findings:
              print('\n'.join(findings), file=sys.stderr)
              print('ERROR: Possible hard-coded credential or secret found in public source.', file=sys.stderr)
              sys.exit(1)
          PY

      - name: Require PHP mail handlers to use server environment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          handlers = (
              Path('php/sendmail.php'),
              Path('php/PHPMailer.php'),
              Path('php/estimate.php'),
              Path('php/estimate-network.php'),
          )
          required_smtp = (
              "getenv('NCI_SMTP_HOST')",
              "getenv('NCI_SMTP_USER')",
              "getenv('NCI_SMTP_PASSWORD')",
          )
          direct_password = re.compile(r"->Password\s*=\s*['\"][^'\"]+['\"]")
          failed = False

          for path in handlers:
              if not path.is_file():
                  print(f'ERROR: required public mail handler is missing: {path}', file=sys.stderr)
                  failed = True
                  continue

              text = path.read_text(encoding='utf-8')
              missing = [item for item in required_smtp if item not in text]
              if missing:
                  print(f'ERROR: {path} must read SMTP configuration from the server environment.', file=sys.stderr)
                  for item in missing:
                      print(f'  missing: {item}', file=sys.stderr)
                  failed = True

              if direct_password.search(text):
                  print(f'ERROR: hard-coded SMTP password found in {path}.', file=sys.stderr)
                  failed = True

          contact = Path('php/sendmail.php').read_text(encoding='utf-8') if Path('php/sendmail.php').is_file() else ''
          if "getenv('NCI_RECAPTCHA_SECRET')" not in contact:
              print('ERROR: Contact handler must read the reCAPTCHA secret from the server environment.', file=sys.stderr)
              failed = True

          if failed:
              sys.exit(1)
          PY
