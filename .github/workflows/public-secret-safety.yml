name: Public Source Secret Safety

on:
  pull_request:
    paths:
      - '**/*.php'
      - '**/*.html'
      - '**/*.js'
      - '**/*.ts'
      - '**/*.tsx'
      - '.cpanel.yml'
      - '.github/workflows/public-secret-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reject-hard-coded-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject known secret assignment patterns
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          extensions = {'.php', '.html', '.js', '.ts', '.tsx', '.yml', '.yaml'}
          pattern = re.compile(
              r"(?i)(password|secret[_-]?key|api[_-]?key)\s*=\s*['\"]([^'\"]{8,})['\"]"
          )
          findings = []

          for path in pathlib.Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in extensions:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for line_number, line in enumerate(text.splitlines(), 1):
                  if pattern.search(line):
                      findings.append(f"{path}:{line_number}: possible hard-coded secret assignment")

          if findings:
              print('\n'.join(findings), file=sys.stderr)
              print('ERROR: Possible hard-coded credential or secret found in public source.', file=sys.stderr)
              sys.exit(1)
          PY

      - name: Require PHP mail handlers to use server environment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          handlers = (
              Path('php/sendmail.php'),
              Path('php/PHPMailer.php'),
              Path('php/estimate.php'),
              Path('php/estimate-network.php'),
          )
          required_smtp = (
              "getenv('NCI_SMTP_HOST')",
              "getenv('NCI_SMTP_USER')",
              "getenv('NCI_SMTP_PASSWORD')",
          )
          direct_password = re.compile(r"->Password\s*=\s*['\"][^'\"]+['\"]")
          failed = False

          for path in handlers:
              if not path.is_file():
                  print(f'ERROR: required public mail handler is missing: {path}', file=sys.stderr)
                  failed = True
                  continue

              text = path.read_text(encoding='utf-8')
              missing = [item for item in required_smtp if item not in text]
              if missing:
                  print(f'ERROR: {path} must read SMTP configuration from the server environment.', file=sys.stderr)
                  for item in missing:
                      print(f'  missing: {item}', file=sys.stderr)
                  failed = True

              if direct_password.search(text):
                  print(f'ERROR: hard-coded SMTP password found in {path}.', file=sys.stderr)
                  failed = True

          contact = Path('php/sendmail.php').read_text(encoding='utf-8') if Path('php/sendmail.php').is_file() else ''
          if "getenv('NCI_RECAPTCHA_SECRET')" not in contact:
              print('ERROR: Contact handler must read the reCAPTCHA secret from the server environment.', file=sys.stderr)
              failed = True

          if failed:
              sys.exit(1)
          PY

      - name: Require contact form reCAPTCHA wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys

          page_path = Path('contact.html')
          handler_path = Path('php/sendmail.php')
          failed = False

          if not page_path.is_file():
              print('ERROR: contact.html is missing.', file=sys.stderr)
              sys.exit(1)
          if not handler_path.is_file():
              print('ERROR: php/sendmail.php is missing.', file=sys.stderr)
              sys.exit(1)

          page = page_path.read_text(encoding='utf-8')
          handler = handler_path.read_text(encoding='utf-8')

          required_page_markers = (
              'https://www.google.com/recaptcha/api.js',
              'class="g-recaptcha"',
              'data-sitekey=',
              'action="/php/sendmail.php"',
          )
          for marker in required_page_markers:
              if marker not in page:
                  print(f'ERROR: contact.html is missing required anti-spam wiring: {marker}', file=sys.stderr)
                  failed = True

          required_handler_markers = (
              "$_POST['g-recaptcha-response']",
              'https://www.google.com/recaptcha/api/siteverify',
              "'networkconnectit.com'",
              "'www.networkconnectit.com'",
          )
          for marker in required_handler_markers:
              if marker not in handler:
                  print(f'ERROR: php/sendmail.php is missing required reCAPTCHA verification control: {marker}', file=sys.stderr)
                  failed = True

          if failed:
              sys.exit(1)
          PY

      - name: Require estimate endpoint abuse controls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          handlers = (
              Path('php/estimate.php'),
              Path('php/estimate-network.php'),
          )
          failed = False

          checks = (
              ('POST-only method guard', re.compile(r"REQUEST_METHOD[^\n]{0,120}POST")),
              ('405 response', re.compile(r"(?:http_response_code\(\s*405\s*\)|nci_estimate_error\(\s*405\s*,)")),
              ('request content-length inspection', re.compile(r"CONTENT_LENGTH")),
              ('32 KiB request cap', re.compile(r"32768|NCI_ESTIMATE_MAX_BODY_BYTES")),
              ('413 response', re.compile(r"(?:http_response_code\(\s*413\s*\)|nci_estimate_error\(\s*413\s*,)")),
              ('content-type inspection', re.compile(r"CONTENT_TYPE")),
              ('415 response', re.compile(r"(?:http_response_code\(\s*415\s*\)|nci_estimate_error\(\s*415\s*,)")),
              ('JSON response content type', re.compile(r"Content-Type:\s*application/json", re.I)),
              ('nosniff response header', re.compile(r"X-Content-Type-Options:\s*nosniff", re.I)),
          )

          for path in handlers:
              if not path.is_file():
                  print(f'ERROR: required estimate endpoint is missing: {path}', file=sys.stderr)
                  failed = True
                  continue

              text = path.read_text(encoding='utf-8')
              for label, pattern in checks:
                  if not pattern.search(text):
                      print(f'ERROR: {path} is missing required request hardening control: {label}', file=sys.stderr)
                      failed = True

              if "getenv('NCI_CONTACT_TO')" not in text:
                  print(f'ERROR: {path} must keep the recipient under server control.', file=sys.stderr)
                  failed = True

          if failed:
              sys.exit(1)
          PY

      - name: Require estimate anti-automation before release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          handlers = (
              Path('php/estimate.php'),
              Path('php/estimate-network.php'),
          )
          limiter_signals = (
              re.compile(r'http_response_code\(\s*429\s*\)'),
              re.compile(r'\brate[_-]?limit', re.I),
              re.compile(r'\bthrottl', re.I),
              re.compile(r'\btoo many requests\b', re.I),
          )
          failed = False

          for path in handlers:
              if not path.is_file():
                  print(f'ERROR: required estimate endpoint is missing: {path}', file=sys.stderr)
                  failed = True
                  continue

              text = path.read_text(encoding='utf-8')
              if not any(pattern.search(text) for pattern in limiter_signals):
                  print(
                      f'ERROR: {path} sends email but has no explicit rate-limiting/429 control. '
                      'Release remains blocked until an approved hosting-compatible anti-automation mechanism is implemented.',
                      file=sys.stderr,
                  )
                  failed = True

          if failed:
              sys.exit(1)
          PY
