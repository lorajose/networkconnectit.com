name: Public Source Secret Safety

on:
  pull_request:
    paths:
      - '**/*.php'
      - '**/*.html'
      - '**/*.js'
      - '**/*.ts'
      - '**/*.tsx'
      - '.cpanel.yml'
      - '.github/workflows/public-secret-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reject-hard-coded-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject known secret assignment patterns
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.md' '(Password|password|secretKey|api[_-]?key)[[:space:]]*=[[:space:]]*[^[:space:]]{8,}' .; then
            echo "ERROR: Possible hard-coded credential or secret found in public source." >&2
            exit 1
          fi
      - name: Require contact handler secrets from environment
        shell: bash
        run: |
          set -euo pipefail
          test -f php/sendmail.php
          grep -Fq "getenv('NCI_RECAPTCHA_SECRET')" php/sendmail.php
          grep -Fq "getenv('NCI_SMTP_PASSWORD')" php/sendmail.php
          if grep -qE 'SMTP.*Password[[:space:]]*=[[:space:]]*[^$[:space:]]+' php/sendmail.php; then
            echo "ERROR: SMTP password must not be committed in source." >&2
            exit 1
          fi
