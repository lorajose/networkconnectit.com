name: Public Source Secret Safety

on:
  pull_request:
    paths:
      - '**/*.php'
      - '**/*.html'
      - '**/*.js'
      - '**/*.ts'
      - '**/*.tsx'
      - '.cpanel.yml'
      - '.github/workflows/public-secret-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reject-hard-coded-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject known secret assignment patterns
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          extensions = {'.php', '.html', '.js', '.ts', '.tsx', '.yml', '.yaml'}
          pattern = re.compile(
              r"(?i)(password|secret[_-]?key|api[_-]?key)\s*=\s*['\"]([^'\"]{8,})['\"]"
          )
          findings = []

          for path in pathlib.Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in extensions:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for line_number, line in enumerate(text.splitlines(), 1):
                  match = pattern.search(line)
                  if match:
                      findings.append(f"{path}:{line_number}: possible hard-coded secret assignment")

          if findings:
              print('\n'.join(findings), file=sys.stderr)
              print('ERROR: Possible hard-coded credential or secret found in public source.', file=sys.stderr)
              sys.exit(1)
          PY

      - name: Require contact handler secrets from environment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path('php/sendmail.php')
          if not path.is_file():
              print('ERROR: php/sendmail.php is missing.', file=sys.stderr)
              sys.exit(1)

          text = path.read_text(encoding='utf-8')
          required = (
              "getenv('NCI_RECAPTCHA_SECRET')",
              "getenv('NCI_SMTP_HOST')",
              "getenv('NCI_SMTP_USER')",
              "getenv('NCI_SMTP_PASSWORD')",
          )
          missing = [item for item in required if item not in text]
          if missing:
              print('ERROR: Contact handler must read sensitive configuration from the server environment.', file=sys.stderr)
              for item in missing:
                  print(f'  missing: {item}', file=sys.stderr)
              sys.exit(1)

          direct_password = re.compile(r"->Password\s*=\s*['\"][^'\"]+['\"]")
          if direct_password.search(text):
              print('ERROR: SMTP password must not be committed in source.', file=sys.stderr)
              sys.exit(1)
          PY
