name: NCI-038 Disable Google Ads

on:
  push:
    branches:
      - nci-038-disable-google-ads

permissions:
  contents: write

jobs:
  disable-adsense:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nci-038-disable-google-ads
          fetch-depth: 0

      - name: Comment Google AdSense code site-wide
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          changed = []

          loader = re.compile(
              r'(?P<indent>^[ \t]*)<script\s+async\s+src="https://pagead2\.googlesyndication\.com/pagead/js/adsbygoogle\.js\?client=[^"]+"\s*\n?\s*crossorigin="anonymous"></script>',
              re.MULTILINE,
          )
          account_meta = re.compile(
              r'(?P<indent>^[ \t]*)<meta\s+name="google-adsense-account"\s+content="[^"]+"\s*/?>',
              re.MULTILINE,
          )
          ad_slot = re.compile(
              r'(?P<indent>^[ \t]*)(<ins\b[^>]*class="[^"]*adsbygoogle[^"]*"[^>]*>.*?</ins>)',
              re.MULTILINE | re.DOTALL,
          )
          push_script = re.compile(
              r'(?P<indent>^[ \t]*)(<script[^>]*>\s*\(adsbygoogle\s*=\s*window\.adsbygoogle\s*\|\|\s*\[\]\)\.push\(\{\}\);\s*</script>)',
              re.MULTILINE | re.DOTALL,
          )

          def comment(label, indent, block):
              return f'{indent}<!-- NCI-038: {label} temporarily disabled for Contractor OS product focus.\n{block}\n{indent}-->'

          for path in sorted(root.rglob('*.html')):
              if '.git' in path.parts or 'command-center-app' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              original = text

              text = loader.sub(lambda m: comment('Google AdSense loader', m.group('indent'), m.group(0).lstrip()), text)
              text = account_meta.sub(lambda m: comment('Google AdSense account metadata', m.group('indent'), m.group(0).lstrip()), text)
              text = ad_slot.sub(lambda m: comment('Google AdSense slot', m.group('indent'), m.group(2)), text)
              text = push_script.sub(lambda m: comment('Google AdSense slot initializer', m.group('indent'), m.group(2)), text)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print(f'Updated {len(changed)} HTML files:')
          for path in changed:
              print(f'  - {path}')

          # Active AdSense code must not remain outside comments. This conservative
          # validation strips HTML comments before checking Google ad markers.
          violations = []
          for path in sorted(root.rglob('*.html')):
              if '.git' in path.parts or 'command-center-app' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              active = re.sub(r'<!--.*?-->', '', text, flags=re.DOTALL)
              if ('pagead2.googlesyndication.com/pagead/js/adsbygoogle.js' in active
                  or 'class="adsbygoogle' in active
                  or '(adsbygoogle = window.adsbygoogle || []).push' in active
                  or 'name="google-adsense-account"' in active):
                  violations.append(str(path))

          if violations:
              raise SystemExit('Active AdSense code remains in: ' + ', '.join(violations))

      - name: Commit reversible ad removal
        run: |
          if git diff --quiet; then
            echo "No AdSense changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' 'tools/**/*.html'
          git commit -m "NCI-038: comment Google AdSense code site-wide"
          git push origin HEAD:nci-038-disable-google-ads
