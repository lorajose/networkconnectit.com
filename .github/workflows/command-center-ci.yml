name: Command Center CI

on:
  pull_request:
    paths:
      - 'command-center-app/**'
      - '*.html'
      - 'tools/**/*.html'
      - '.github/workflows/command-center-ci.yml'
  push:
    branches: [main]
    paths:
      - 'command-center-app/**'
      - '.github/workflows/command-center-ci.yml'

permissions:
  contents: write

concurrency:
  group: command-center-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nci038-transform:
    if: github.event_name == 'pull_request' && github.head_ref == 'nci-038-disable-google-ads' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NCI-038 branch
        uses: actions/checkout@v4
        with:
          ref: nci-038-disable-google-ads
          fetch-depth: 0

      - name: Comment Google AdSense code site-wide
        shell: python
        run: |
          from pathlib import Path
          import re

          changed = []
          loader = re.compile(r'(?P<indent>^[ \t]*)<script\s+async\s+src="https://pagead2\.googlesyndication\.com/pagead/js/adsbygoogle\.js\?client=[^"]+"\s*\n?\s*crossorigin="anonymous"></script>', re.MULTILINE)
          account_meta = re.compile(r'(?P<indent>^[ \t]*)<meta\s+name="google-adsense-account"\s+content="[^"]+"\s*/?>', re.MULTILINE)
          ad_slot = re.compile(r'(?P<indent>^[ \t]*)(<ins\b[^>]*class="[^"]*adsbygoogle[^"]*"[^>]*>.*?</ins>)', re.MULTILINE | re.DOTALL)
          push_script = re.compile(r'(?P<indent>^[ \t]*)(<script[^>]*>\s*\(adsbygoogle\s*=\s*window\.adsbygoogle\s*\|\|\s*\[\]\)\.push\(\{\}\);\s*</script>)', re.MULTILINE | re.DOTALL)

          def comment(label, indent, block):
              return f'{indent}<!-- NCI-038: {label} temporarily disabled for Contractor OS product focus.\n{block}\n{indent}-->'

          for path in sorted(Path('.').rglob('*.html')):
              if '.git' in path.parts or 'command-center-app' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              original = text
              text = loader.sub(lambda m: comment('Google AdSense loader', m.group('indent'), m.group(0).lstrip()), text)
              text = account_meta.sub(lambda m: comment('Google AdSense account metadata', m.group('indent'), m.group(0).lstrip()), text)
              text = ad_slot.sub(lambda m: comment('Google AdSense slot', m.group('indent'), m.group(2)), text)
              text = push_script.sub(lambda m: comment('Google AdSense slot initializer', m.group('indent'), m.group(2)), text)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print(f'Updated {len(changed)} HTML files')
          print('\n'.join(changed))

          violations = []
          for path in sorted(Path('.').rglob('*.html')):
              if '.git' in path.parts or 'command-center-app' in path.parts:
                  continue
              active = re.sub(r'<!--.*?-->', '', path.read_text(encoding='utf-8'), flags=re.DOTALL)
              markers = [
                  'pagead2.googlesyndication.com/pagead/js/adsbygoogle.js',
                  'class="adsbygoogle',
                  '(adsbygoogle = window.adsbygoogle || []).push',
                  'name="google-adsense-account"',
              ]
              if any(marker in active for marker in markers):
                  violations.append(str(path))
          if violations:
              raise SystemExit('Active AdSense code remains in: ' + ', '.join(violations))

      - name: Commit transformed HTML
        run: |
          if git diff --quiet; then
            echo "No AdSense changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' 'tools/**/*.html'
          git commit -m "NCI-038: comment Google AdSense code site-wide"
          git push origin HEAD:nci-038-disable-google-ads

  verify:
    if: github.event_name != 'pull_request' || github.head_ref != 'nci-038-disable-google-ads'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: command-center-app
    env:
      DATABASE_URL: mysql://ci_user:ci_password@127.0.0.1:3306/command_center_ci
      NEXTAUTH_SECRET: ci-only-not-a-production-secret
      NEXTAUTH_URL: http://localhost:3000/tools/command-center
      ENABLE_FIRST_ADMIN_BOOTSTRAP: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: command-center-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run security regressions and staging verification
        run: npm run verify:ci
