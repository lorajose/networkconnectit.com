name: Command Center CI

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'command-center-app/**'
      - '.github/workflows/command-center-ci.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'command-center-app/**'
      - '.github/workflows/command-center-ci.yml'

permissions:
  contents: read

concurrency:
  group: command-center-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: command-center-app
    env:
      DATABASE_URL: mysql://ci_user:ci_password@127.0.0.1:3306/command_center_ci
      NEXTAUTH_SECRET: ci-only-not-a-production-secret
      NEXTAUTH_URL: http://localhost:3000/tools/command-center
      ENABLE_FIRST_ADMIN_BOOTSTRAP: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: command-center-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run security regressions and staging verification
        run: npm run verify:ci

  godaddy-root-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install from repository root like GoDaddy
        run: npm ci

      - name: Build from repository root like GoDaddy
        run: npm run build

      - name: Verify standalone build artifacts
        run: |
          test -f command-center-app/.next/build-manifest.json
          test -f command-center-app/.next/standalone/server.js

  operations-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: disposable-ci-root
          MYSQL_DATABASE: operations_ci_test
          MYSQL_USER: operations_ci
          MYSQL_PASSWORD: disposable-ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: command-center-app
    env:
      CI: 'true'
      DATABASE_URL: mysql://operations_ci:disposable-ci-password@127.0.0.1:3306/operations_ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: command-center-app/package-lock.json
      - run: npm ci
      - name: Verify real MySQL operations concurrency and tenant isolation
        run: node scripts/test-operations-mysql.cjs
